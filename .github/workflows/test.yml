name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  install:
    name: Install on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install git-cliff
        uses: ./
        with:
          version: "2.12.0"
      - name: git-cliff is on PATH
        run: git-cliff --version
